<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel · Lunéa Cakes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf6f2;color:#3a1f27;font:17px/1.45 system-ui,sans-serif}main{max-width:640px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;margin:8px 0 12px;color:#7a2433}header{display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1px solid #ecdcd8;border-radius:18px;padding:14px;margin:12px 0}
label{display:block;font-weight:600;margin:10px 0}input,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1.5px solid #ecdcd8;border-radius:12px;font:inherit;background:#fff;color:inherit}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:999px;background:#7a2433;color:#fff;font:600 17px system-ui;cursor:pointer;margin:10px 0}.btn.out{background:transparent;color:#7a2433;border:2px solid #7a2433}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:0 16px;font-size:15px;margin:6px 6px 0 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.off{opacity:.55}.th{width:64px;height:64px;border-radius:12px;background:#f6d9de;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.nf{flex:1;min-width:140px}.nf small{display:block;color:#7d6168}.ac{width:100%}
.sr{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;margin:6px 0}.sr input{margin:0}.x{border:0;background:#f6d9de;border-radius:10px;font-size:18px;cursor:pointer}
.err{color:#b3261e;font-weight:600}.ck{display:flex;gap:10px;align-items:center}.ck input{width:24px;height:24px;margin:0}.pr{max-width:100%;max-height:200px;border-radius:12px;margin:8px 0;display:block}small{color:#7d6168}
</style></head><body><main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,setDoc,deleteDoc,doc,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app0=initializeApp({apiKey:"AIzaSyBNhRIcHGZqGrELJQn96ObVkddZudVmmw8",authDomain:"lunea-cakes.firebaseapp.com",projectId:"lunea-cakes",appId:"1:796273813888:web:7ad20bf1e189993be43965"}),auth=getAuth(app0),db=getFirestore(app0),BASE=[{"n":"Brownie","d":"Brownie, dulce de leche, merengue y nueces.","c":"Tortas","i":"br28","g":[],"vl":[],"s":[{"l":"18 cm · 12 porciones","p":20000,"k":"br18"},{"l":"28 cm · 20 porciones","p":25000,"k":"br28"}],"v":true,"o":1},{"n":"Marquise de frutillas","d":"Dulce de leche, crema chantilly y frutillas.","c":"Tortas","i":"mq28","g":[],"vl":[],"s":[{"l":"18 cm","p":23000,"k":""},{"l":"28 cm","p":35000,"k":""}],"v":true,"o":2},{"n":"Marquise de frutos rojos","d":"Dulce de leche, crema chantilly y frutos rojos.","c":"Tortas","i":"mq18","g":[],"vl":[],"s":[{"l":"18 cm","p":23000,"k":""},{"l":"28 cm","p":35000,"k":""}],"v":true,"o":3},{"n":"Marquise Oreo","d":"Dulce de leche, crema chantilly y galletas Oreo.","c":"Tortas","i":"mq_oreo","g":[],"vl":[],"s":[{"l":"18 cm","p":23000,"k":""},{"l":"28 cm","p":35000,"k":""}],"v":true,"o":4},{"n":"Rogel","d":"Capas, dulce de leche y merengue.","c":"Tortas","i":"rg24","g":[],"vl":[],"s":[{"l":"18 cm · 12 porciones","p":15000,"k":""},{"l":"24 cm · 20 porciones","p":23000,"k":"rg24"}],"v":true,"o":5},{"n":"Chocotorta","d":"Chocotorta clásica. Consultá por toppers personalizados.","c":"Tortas","i":"chocotorta","g":[],"vl":[],"s":[{"l":"24 cm","p":40000,"k":""}],"v":true,"o":6},{"n":"Tarta de durazno","d":"Masa sablée, dulce de leche, crema chantilly y durazno. 16 porciones.","c":"Tartas","i":"du28","g":[],"vl":[],"s":[{"l":"20 cm","p":15000,"k":""},{"l":"28 cm","p":23000,"k":"du28"}],"v":true,"o":7},{"n":"Tarta de frutilla","d":"Masa sablée, dulce de leche, crema chantilly y frutillas. 16 porciones.","c":"Tartas","i":"fr28","g":[],"vl":[],"s":[{"l":"20 cm","p":15000,"k":"fr20"},{"l":"28 cm","p":23000,"k":"fr28"}],"v":true,"o":8},{"n":"Tarta de frutos rojos","d":"Masa sablée, dulce de leche, crema chantilly y frutos rojos. 16 porciones.","c":"Tartas","i":"fo28","g":[],"vl":[],"s":[{"l":"20 cm","p":16000,"k":""},{"l":"28 cm","p":25000,"k":"fo28"}],"v":true,"o":9},{"n":"Banana split","d":"Masa sablée, dulce de leche, banana y crema chantilly. 16 porciones.","c":"Tartas","i":"bn28","g":[],"vl":[],"s":[{"l":"20 cm","p":15000,"k":""},{"l":"28 cm","p":20000,"k":"bn28"}],"v":true,"o":10},{"n":"Lemon pie","d":"Masa sablée, crema de limón y merengue. 16 porciones.","c":"Tartas","i":"lm28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":18000,"k":"lm28"}],"v":true,"o":11},{"n":"Tarta de coco","d":"Masa sablée, dulce de leche y coco rallado. 16 porciones.","c":"Tartas","i":"co28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":18000,"k":"co28"}],"v":true,"o":12},{"n":"Cabsha chocolate negro","d":"Masa sablée, dulce de leche y baño de chocolate. 16 porciones.","c":"Tartas","i":"cn28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":18000,"k":"cn28"}],"v":true,"o":13},{"n":"Cabsha chocolate blanco","d":"Masa sablée, dulce de leche y baño de chocolate blanco. 16 porciones.","c":"Tartas","i":"cb28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":18000,"k":"cb28"}],"v":true,"o":14},{"n":"Mousse de chocolate","d":"Masa sablée, dulce de leche y mousse de chocolate. 16 porciones.","c":"Tartas","i":"mo28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":20000,"k":"mo28"}],"v":true,"o":15},{"n":"Bonobom","d":"Masa sablée, dulce de leche y crema Bonobom.","c":"Tartas","i":"bo28","g":[],"vl":[],"s":[{"l":"20 cm","p":13000,"k":""},{"l":"28 cm","p":20000,"k":"bo28"}],"v":true,"o":16},{"n":"Block","d":"Masa sablée, dulce de leche, maní y baño de chocolate.","c":"Tartas","i":"block","g":[],"vl":[],"s":[{"l":"20 cm","p":16000,"k":""},{"l":"28 cm","p":20000,"k":"block"}],"v":true,"o":17},{"n":"Oreo","d":"Masa sablée, dulce de leche, galletas Oreo y crema chantilly.","c":"Tartas","i":"or28","g":[],"vl":[],"s":[{"l":"20 cm","p":16000,"k":""},{"l":"28 cm","p":25000,"k":"or28"}],"v":true,"o":18},{"n":"Postre chocotorta","d":"Base de galletas chocolinas y crema de dulce de leche.","c":"Postres","i":"pch","g":[],"vl":[],"s":[{"l":"Unidad","p":4000,"k":""}],"v":true,"o":19},{"n":"Postre Oreo","d":"Base de galletas Oreo, dulce de leche y crema chantilly.","c":"Postres","i":"po1","g":["po2"],"vl":[],"s":[{"l":"Unidad","p":4000,"k":""}],"v":true,"o":20},{"n":"Bizcochuelo decorado","d":"Hecho a tu gusto: colores, corazón, escudo de tu equipo y topper de cumpleaños. Consultá precio.","c":"Bizcochuelos","i":"biz_celeste","g":[],"vl":[{"l":"Celeste clásico","k":"biz_celeste"},{"l":"Escudo de equipo","k":"biz_cat"},{"l":"Corazón","k":"biz_corazon"}],"s":[],"v":true,"o":21}];
const $=s=>document.querySelector(s),app=$("#app"),E=t=>String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"),money=n=>"$"+Number(n).toLocaleString("es-AR");
let L=[];
onAuthStateChanged(auth,u=>u?load():login());
function login(msg){app.innerHTML=`<h1>Panel de Lunéa Cakes</h1><form id="f" class="card"><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label><p class="err">${msg||""}</p><button class="btn">Entrar</button><button type="button" class="btn out" id="rs">Olvidé mi contraseña</button></form>`;
$("#f").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}catch(x){login("Email o contraseña incorrectos.")}};
$("#rs").onclick=async()=>{const m=$("#em").value.trim();if(!m)return alert("Escribí tu email arriba y tocá de nuevo.");try{await sendPasswordResetEmail(auth,m);alert("Te enviamos un mail para cambiar la contraseña.")}catch(x){alert("No se pudo enviar el mail.")}}}
async function load(){app.innerHTML="<p>Cargando…</p>";try{const q=await getDocs(collection(db,"productos"));L=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.o||0)-(b.o||0));list()}catch(e){app.innerHTML='<p class="err">Este usuario no tiene permiso. Entrá con el email correcto.</p><button class="btn" id="so">Salir</button>';$("#so").onclick=()=>signOut(auth)}}
function list(){app.innerHTML=`<header><h1>Productos</h1><button class="btn out sm" id="so">Salir</button></header><button class="btn" id="add">+ Agregar producto</button>${L.length?"":`<div class="card"><p>Todavía no cargaste los productos que ya tiene la página.</p><button class="btn" id="imp">Cargar el catálogo actual</button></div>`}${L.map(p=>`<div class="card row ${p.v===false?"off":""}"><div class="th">${(p.i||"").startsWith("data:")?`<img src="${p.i}">`:"🎂"}</div><div class="nf"><b>${E(p.n)}</b><small>${E(p.c)} · ${(p.s||[]).length?"Desde "+money(Math.min(...p.s.map(s=>s.p))):"A consultar"}${p.v===false?" · OCULTO":""}</small></div><div class="ac"><button class="btn sm" data-a="e" data-id="${p.id}">Editar</button><button class="btn out sm" data-a="v" data-id="${p.id}">${p.v===false?"Mostrar":"Ocultar"}</button><button class="btn out sm" data-a="d" data-id="${p.id}">Eliminar</button></div></div>`).join("")}`;
$("#so").onclick=()=>signOut(auth);$("#add").onclick=()=>form();if($("#imp"))$("#imp").onclick=async()=>{if(!confirm("¿Cargar el catálogo actual?"))return;const b=writeBatch(db);BASE.forEach(p=>b.set(doc(collection(db,"productos")),p));await b.commit();load()};
app.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const p=L.find(x=>x.id==b.dataset.id),a=b.dataset.a;
if(a=="e")form(p);if(a=="v"){await setDoc(doc(db,"productos",p.id),{v:p.v===false},{merge:true});load()}
if(a=="d"&&confirm("¿Eliminar «"+p.n+"»? No se puede deshacer.")){await deleteDoc(doc(db,"productos",p.id));load()}}}
const comp=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function form(p){const e=p||{s:[{l:"",p:""}],v:true};let img=null;app.onclick=null;
app.innerHTML=`<h1>${p?"Editar":"Agregar"} producto</h1><form id="f" class="card"><label>Nombre<input id="n" required value="${E(e.n)}"></label><label>Categoría<input id="c" list="cs" required placeholder="Ej: Tortas" value="${E(e.c)}"></label><datalist id="cs">${[...new Set(L.map(x=>x.c))].map(c=>`<option value="${E(c)}">`).join("")}</datalist><label>Descripción<textarea id="d" rows="3">${E(e.d)}</textarea></label><div><b>Tamaños y precios</b><div id="ss"></div><button type="button" class="btn out sm" id="as">+ Agregar tamaño</button><br><small>Si es un solo precio, dejá una fila (ej: "Unidad" y el precio). Sin filas = "Consultar precio".</small></div><div style="margin-top:14px"><b>Foto</b><div id="pv">${(e.i||"").startsWith("data:")?`<img class="pr" src="${e.i}">`:(e.i?"<small>Se mantiene la foto actual.</small>":"")}</div><input type="file" id="fi" accept="image/*"></div><label class="ck"><input type="checkbox" id="vi" ${e.v===false?"":"checked"}> Mostrar en la página</label><p class="err" id="er"></p><button class="btn">Guardar</button><button type="button" class="btn out" id="ca">Cancelar</button></form>`;
const ss=$("#ss"),row=s=>{const d=document.createElement("div");d.className="sr";d.dataset.k=s.k||"";d.innerHTML=`<input placeholder="Tamaño (ej: 18 cm)" value="${E(s.l)}"><input type="number" inputmode="numeric" placeholder="Precio" value="${E(s.p)}"><button type="button" class="x">✕</button>`;d.querySelector(".x").onclick=()=>d.remove();ss.appendChild(d)};
(e.s||[]).forEach(row);$("#as").onclick=()=>row({l:"",p:""});$("#ca").onclick=list;
$("#fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{img=await comp(f);$("#pv").innerHTML=`<img class="pr" src="${img}">`}catch(x){$("#er").textContent="No se pudo leer la foto."}};
$("#f").onsubmit=async ev=>{ev.preventDefault();const s=[...ss.children].map(d=>{const i=d.querySelectorAll("input");return{l:i[0].value.trim(),p:Number(i[1].value),k:d.dataset.k}}).filter(x=>x.l&&x.p>0);
const data={n:$("#n").value.trim(),c:$("#c").value.trim(),d:$("#d").value.trim(),s,v:$("#vi").checked};if(img)data.i=img;
try{if(p)await setDoc(doc(db,"productos",p.id),data,{merge:true});else{data.o=Math.max(0,...L.map(x=>x.o||0))+1;await addDoc(collection(db,"productos"),data)}load()}catch(x){$("#er").textContent="No se pudo guardar. Probá de nuevo."}}}
</script></body></html>
